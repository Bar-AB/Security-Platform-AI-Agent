services:
  mock-server:
    build: .
    command: uvicorn mock_server.main:app --host 0.0.0.0 --port 8000
    environment:
      MCP_ALLOWED_HOSTS: mock-server
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8001
    env_file: .env
    environment:
      MCP_SERVER_URL: http://mock-server:8000/mcp
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-mock-token}
      CHROMA_PERSIST_DIR: /data/chroma_db
      DOCS_DIR: /app/docs
    volumes:
      - chroma-data:/data
    ports:
      - "8001:8001"
    depends_on:
      mock-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  chroma-data:
