server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /chat {
        proxy_pass http://api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://api:8001;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
